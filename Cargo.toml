[workspace]
resolver = "2"
members = ["kcore", "kvault", "khal", "knet", "kpaging", "kipc", "kscheduler", "kheap", "kblock", "kboot", "kernel", "kash-ui/crates/kash-ui"]

[profile.release]
opt-level = 2
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = true

[profile.kernel]
inherits = "release"
opt-level = "s"         # size-optimise kernel binary
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = true
