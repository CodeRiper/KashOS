[package]
name = "knet"
version = "0.2.0"
authors = ["Akash <akash.official.j@gmail.com>"]
edition = "2021"
description = "Phantom Kernel network layer: packet filter, telemetry domain, anonymity gateway."

[dependencies]
khal = { path = "../khal" }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "socket-dns", "medium-ethernet"] }

