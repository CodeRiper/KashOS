name: KashOS CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel-build:
    name: Build Microkernel (x86-64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gcc

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools-preview

      - name: Check Kernel Build
        run: cargo check --target x86_64-unknown-none --manifest-path kernel/Cargo.toml

      - name: Build Kernel (Release)
        run: cargo build --release --target x86_64-unknown-none --manifest-path kernel/Cargo.toml

  subsystem-tests:
    name: Workspace Subsystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Workspace Tests
        run: cargo test --workspace --exclude kernel --features kvault/test-fast-kdf

  honesty-gate:
    name: Build Guide v2 Claims & Honesty Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Claims Linter (Appendix A)
        run: python3 tools/claims_lint.py

      - name: Verify Ground Truth Findings (Master Plan Section 1)
        run: python3 tools/verify_findings.py

      - name: Verify Remote Network Fails Closed Until Implemented
        run: python3 tools/test_network_fail_closed.py

      - name: Verify NIC DMA Fails Closed Until Isolated
        run: python3 tools/test_nic_dma_fail_closed.py

      - name: Verify VT-d Fails Closed Until Hardware Tables Exist
        run: python3 tools/test_vtd_fail_closed.py

      - name: Verify DDE Does Not Fabricate DMA Addresses
        run: python3 tools/test_dde_dma_fail_closed.py

      - name: Verify Userland Claims Match Ring 0 Boot Paths
        run: python3 tools/test_userland_fail_closed.py

      - name: Verify User Process Capabilities Fail Closed
        run: python3 tools/test_process_authority_fail_closed.py

      - name: Verify Syscall Entry Uses Trusted Per-CPU State
        run: python3 tools/test_syscall_entry_fail_closed.py

      - name: Verify Secondary CPUs Stay Parked Until Initialized
        run: python3 tools/test_smp_aps_fail_closed.py

      - name: Verify UI Privacy and Network Claims
        run: python3 tools/test_ui_honesty.py

      - name: Verify UI Privacy and Network Claims
        run: python3 tools/test_ui_honesty.py

      - name: Verify Boot Storage Tests Are Non-Destructive
        run: python3 tools/test_storage_non_destructive.py

      - name: Verify KMS Boots Locked
        run: python3 tools/test_kms_boot_locked.py

      - name: Verify Legacy Installer Cannot Write Disks
        run: python3 tools/test_installer_fail_closed.py

      - name: Verify TPM Production APIs Fail Closed
        run: python3 tools/test_tpm_fail_closed.py

      - name: Verify Vault KDF Memory Budget
        run: python3 tools/test_kdf_memory_budget.py



