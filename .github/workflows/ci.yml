name: KashOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel-build:
    name: Build Microkernel (x86-64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gcc

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools-preview

      - name: Check Kernel Build
        run: cargo check --target x86_64-unknown-none --manifest-path kernel/Cargo.toml

      - name: Build Kernel (Release)
        run: cargo build --release --target x86_64-unknown-none --manifest-path kernel/Cargo.toml

  subsystem-tests:
    name: Workspace Subsystem Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Workspace Tests
        run: cargo test --workspace --exclude kernel
